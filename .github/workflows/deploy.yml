name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies with npm
        # --legacy-peer-deps: npm's default resolver crashes on this dependency
        # tree ("edgesOut" of null); legacy resolution installs it cleanly.
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Test routing
        run: npm test -- src/test/app-routing.test.tsx
      - name: Build static portfolio
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Prepare dist and certificates
        run: node scripts/prepare-github-pages.mjs
      - name: Upload dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4